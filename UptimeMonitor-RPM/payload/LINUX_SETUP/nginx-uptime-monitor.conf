# ============================================================
# Uptime Monitoring — Nginx Reverse Proxy (example)
# Place in: /etc/nginx/conf.d/uptime-monitor.conf
# Terminates HTTPS and proxies to the app on localhost:5000.
# Replace the placeholders (server_name, SSL cert paths, ports).
# ============================================================

# Optional: redirect HTTP to HTTPS
server {
    listen 80;
    server_name your-monitor-host.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-monitor-host.example.com;

    # Supply your own certificate and key.
    ssl_certificate     /etc/ssl/certs/your-monitor-host.crt;
    ssl_certificate_key /etc/ssl/private/your-monitor-host.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/uptime-monitor-access.log;
    error_log  /var/log/nginx/uptime-monitor-error.log;

    location / {
        proxy_pass            http://127.0.0.1:5000;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_set_header      Cookie $http_cookie;
        proxy_pass_header     Set-Cookie;
    }

    location ~* \.(js|css|png|jpg|svg|avif|ico|woff2)$ {
        proxy_pass http://127.0.0.1:5000;
        add_header Cache-Control "public, max-age=3600";
    }
}
